services:

  products-db:
    image: widgetario/products-db:26.06
    build:
      context: db/postgres
    ports:
      - "5432:5432"
    networks:
      - app-net

  products-api:
    image: widgetario/products-api:dotnet-26.06
    build:
      context: products-api/dotnet
    ports:
      - "8081:80"
    networks:
      - app-net
    depends_on:
      - products-db

  stock-api:
    image: widgetario/stock-api:dotnet-26.06
    build:
      context: stock-api/dotnet
    ports:
      - "8082:80"
    networks:
      - app-net
    depends_on:
      - products-db

  web:
    image: widgetario/web:dotnet-serilog-26.06
    build:
      context: web/dotnet
    environment:
      - Widgetario__StockApi__Url=http://stock-api/stock
    ports:
      - "8080:80"
    networks:
      - app-net
    depends_on:
      - products-api
      - stock-api

networks:
  app-net:
