services:

  products-db:
    image: widgetario/products-db:26.06
    build:
      context: db/postgres

  products-db-replicated:
    image: widgetario/products-db-replicated:26.06
    build:
      context: db/postgres-replicated

  products-db-replicated-v2:
    image: widgetario/products-db-replicated:26.06-v2
    build:
      context: db/postgres-replicated
      dockerfile: Dockerfile.v2

  products-api:
    image: widgetario/products-api:26.06
    build:
      context: products-api/java

  products-api-v2:
    image: widgetario/products-api:26.06-v2
    build:
      context: products-api/java
      dockerfile: Dockerfile.v2

  stock-api:
    image: widgetario/stock-api:26.06
    build:
      context: stock-api/golang

  stock-api-v2:
    image: widgetario/stock-api:26.06-v2
    build:
      context: stock-api/golang
      dockerfile: Dockerfile.v2

  web:
    image: widgetario/web:26.06
    build:
      context: web/dotnet

  web-v2:
    image: widgetario/web:26.06-v2
    build:
      context: web/dotnet
      dockerfile: Dockerfile.v2
